name: Daily Garmin recovery data

on:
  schedule:
  - cron: "40 6 * * *"   # 08:40 Oslo now, 07:40 after the switch to winter time
  workflow_dispatch: {}     # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: garmin-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch last night's data
        env:
          GARMIN_TOKEN_KEY: ${{ secrets.GARMIN_TOKEN_KEY }}
        run: python fetch.py
      - name: Commit data and refreshed tokens
        if: always()
        run: |
          git config user.name "garmin-bot"
          git config user.email "garmin-bot@users.noreply.github.com"
          git add data state
          git diff --cached --quiet || git commit -m "Garmin data $(date -u +%F)"
          git push
